services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8080
      - --project=demo-news-summarizer
    ports:
      - "8080:8080"

  web:
    build: .
    ports:
      - "3080:3000"
    environment:
      GOOGLE_CLOUD_PROJECT: "demo-news-summarizer"
      FIRESTORE_EMULATOR_HOST: "firestore:8080"
      # 定義元は News-Summarizer/categories.yaml。本番は infra/main.tf が
      # 同ファイルから生成して注入するので、ここだけ編集しても本番には効かない。
      CATEGORY_ORDER: "AI・機械学習,テクノロジー,経済・ビジネス,政治・社会,事件・事故・災害,科学・環境,健康・ライフ,カルチャー"
      # 意味検索を試す場合のみ設定する（鍵はコミットしないこと）。
      # サマライザ側の embedding_model / embedding_base_url と一致させること。
      # 未設定ならキーワード一致のみに縮退する。
      # EMBEDDING_BASE_URL: "https://openrouter.ai/api/v1"
      # LLM_EMBEDDING_MODEL: "openai/text-embedding-3-small"
      # EMBEDDING_DIMENSION: "1536"
      # EMBEDDING_API_KEY: ""
    depends_on:
      - firestore
    restart: unless-stopped
