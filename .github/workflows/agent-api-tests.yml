name: Agent API tests
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/agent-api-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DB_BACKEND: sqlite
          DATABASE_URL: file:/tmp/news-api-test-missing.db
